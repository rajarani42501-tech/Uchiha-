<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            list-style: none;
            padding: 10px;
            background: #eee;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>My To-Do List 📝</h1>

        <input id="task" type="text" placeholder="Enter your task">
        <button onclick="addTask()">Add</button>

        <ul id="list"></ul>
    </div>

    <script>
        function addTask() {

            let task = document.getElementById("task").value;

            if (task == "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            li.innerText = task;

            document.getElementById("list").appendChild(li);

            document.getElementById("task").value = "";
        }
    </script>

</body>
</html>
